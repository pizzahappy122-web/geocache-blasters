<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geocache Space Blaster</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #17233f, #04060b 68%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  main {
    width: min(980px, 96vw);
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    letter-spacing: 2px;
  }
  #instructions {
    margin: 0 0 8px;
    color: #cbd5ff;
  }
  #message {
    min-height: 34px;
    margin: 8px 0;
    font-size: 24px;
    font-weight: bold;
    color: #72ff98;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #02040a;
    border: 3px solid #5a72ab;
    border-radius: 12px;
    box-shadow: 0 0 26px rgba(84, 120, 255, 0.35);
  }
  button {
    margin-top: 12px;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>GEOCACHE SPACE BLASTER</h1>
  <p id="instructions">Arrow keys move and rotate. Spacebar shoots. Destroy green ammo-can geocaches and reach 10,000 points.</p>
  <p id="message"></p>
  <canvas id="game" width="900" height="600"></canvas>
  <button id="restart">Start / Restart</button>
</main>

<script>
// Reward function at the TOP of the script
async function fetchRewardCode() {
  const response = await fetch(
    "https://backend-codes-mtpj.onrender.com/secret?token=pizzayay123"
  );
  const data = await response.json();
  return data.code;
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const restartButton = document.getElementById("restart");

const keys = {};
const stars = Array.from({ length: 140 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  size: Math.random() * 2 + 0.5,
  speed: Math.random() * 22 + 8
}));

let ship;
let bullets = [];
let enemies = [];
let particles = [];
let score = 0;
let lives = 3;
let level = 1;
let running = false;
let gameOver = false;
let rewardTriggered = false;
let spawnTimer = 0;
let shootCooldown = 0;
let invincibleTimer = 0;
let lastTime = 0;

function resetShip() {
  ship = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    angle: -Math.PI / 2,
    vx: 0,
    vy: 0,
    radius: 18
  };
  invincibleTimer = 2;
}

function resetGame() {
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  level = 1;
  gameOver = false;
  running = true;
  rewardTriggered = false;
  spawnTimer = 0;
  shootCooldown = 0;
  message.textContent = "";
  resetShip();
}

function wrap(obj, margin = 0) {
  if (obj.x < -margin) obj.x = canvas.width + margin;
  if (obj.x > canvas.width + margin) obj.x = -margin;
  if (obj.y < -margin) obj.y = canvas.height + margin;
  if (obj.y > canvas.height + margin) obj.y = -margin;
}

function shoot() {
  if (shootCooldown > 0 || !running || gameOver) return;

  const bulletSpeed = 540;
  bullets.push({
    x: ship.x + Math.cos(ship.angle) * 25,
    y: ship.y + Math.sin(ship.angle) * 25,
    vx: Math.cos(ship.angle) * bulletSpeed + ship.vx,
    vy: Math.sin(ship.angle) * bulletSpeed + ship.vy,
    radius: 3,
    life: 1.3
  });

  shootCooldown = 0.17;
}

function spawnEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;

  if (edge === 0) { x = Math.random() * canvas.width; y = -50; }
  if (edge === 1) { x = canvas.width + 50; y = Math.random() * canvas.height; }
  if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 50; }
  if (edge === 3) { x = -50; y = Math.random() * canvas.height; }

  const size = 26 + Math.random() * 18;
  const direction = Math.atan2(ship.y - y, ship.x - x) + (Math.random() - 0.5) * 0.55;
  const speed = 60 + Math.random() * 45 + level * 6;

  enemies.push({
    x, y,
    vx: Math.cos(direction) * speed,
    vy: Math.sin(direction) * speed,
    radius: size,
    rotation: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 1.4,
    hp: size > 36 ? 2 : 1,
    points: size > 36 ? 400 : 250
  });
}

function createExplosion(x, y, amount = 20) {
  for (let i = 0; i < amount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 45 + Math.random() * 190;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.35 + Math.random() * 0.65,
      size: 2 + Math.random() * 4
    });
  }
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function triggerReward() {
  if (rewardTriggered) return;

  rewardTriggered = true;
  running = false;
  message.textContent = "Loading reward code...";

  fetchRewardCode()
    .then(code => {
      message.textContent = "Reward Code: " + code;
    })
    .catch(() => {
      message.textContent = "Error fetching reward code.";
    });
}

function update(dt) {
  for (const star of stars) {
    star.y += star.speed * dt;
    if (star.y > canvas.height) {
      star.y = 0;
      star.x = Math.random() * canvas.width;
    }
  }

  if (!running || gameOver) return;

  if (keys.ArrowLeft) ship.angle -= 3.6 * dt;
  if (keys.ArrowRight) ship.angle += 3.6 * dt;

  if (keys.ArrowUp) {
    ship.vx += Math.cos(ship.angle) * 260 * dt;
    ship.vy += Math.sin(ship.angle) * 260 * dt;
  }

  if (keys.ArrowDown) {
    ship.vx *= Math.pow(0.05, dt);
    ship.vy *= Math.pow(0.05, dt);
  }

  if (keys[" "]) shoot();

  ship.vx *= Math.pow(0.72, dt);
  ship.vy *= Math.pow(0.72, dt);

  const speed = Math.hypot(ship.vx, ship.vy);
  const maxSpeed = 315;

  if (speed > maxSpeed) {
    ship.vx = ship.vx / speed * maxSpeed;
    ship.vy = ship.vy / speed * maxSpeed;
  }

  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
  wrap(ship, ship.radius);

  shootCooldown = Math.max(0, shootCooldown - dt);
  invincibleTimer = Math.max(0, invincibleTimer - dt);

  spawnTimer -= dt;
  const spawnRate = Math.max(0.34, 1.1 - level * 0.07);

  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = spawnRate;
  }

  for (const bullet of bullets) {
    bullet.x += bullet.vx * dt;
    bullet.y += bullet.vy * dt;
    bullet.life -= dt;
  }

  bullets = bullets.filter(b =>
    b.life > 0 &&
    b.x > -20 && b.x < canvas.width + 20 &&
    b.y > -20 && b.y < canvas.height + 20
  );

  for (const enemy of enemies) {
    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;
    enemy.rotation += enemy.spin * dt;
    wrap(enemy, 55);
  }

  for (const particle of particles) {
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vx *= Math.pow(0.2, dt);
    particle.vy *= Math.pow(0.2, dt);
    particle.life -= dt;
  }

  particles = particles.filter(p => p.life > 0);

  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      if (distance(bullets[bi], enemies[ei]) < bullets[bi].radius + enemies[ei].radius) {
        enemies[ei].hp--;
        createExplosion(bullets[bi].x, bullets[bi].y, 6);
        bullets.splice(bi, 1);

        if (enemies[ei].hp <= 0) {
          score += enemies[ei].points;
          createExplosion(enemies[ei].x, enemies[ei].y, 24);
          enemies.splice(ei, 1);

          level = Math.floor(score / 2000) + 1;

          if (score >= 10000) {
            triggerReward();
          }
        }

        break;
      }
    }
  }

  if (invincibleTimer <= 0) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      if (distance(ship, enemies[ei]) < ship.radius + enemies[ei].radius * 0.75) {
        createExplosion(ship.x, ship.y, 30);
        enemies.splice(ei, 1);
        lives--;

        if (lives <= 0) {
          gameOver = true;
          running = false;
        } else {
          resetShip();
        }

        break;
      }
    }
  }
}

function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);

  if (invincibleTimer > 0 && Math.floor(invincibleTimer * 10) % 2 === 0) {
    ctx.globalAlpha = 0.3;
  }

  if (keys.ArrowUp && running) {
    ctx.fillStyle = "#ff9e2b";
    ctx.beginPath();
    ctx.moveTo(-17, -8);
    ctx.lineTo(-38 - Math.random() * 8, 0);
    ctx.lineTo(-17, 8);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = "#5fe7ff";
  ctx.strokeStyle = "#e8ffff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(24, 0);
  ctx.lineTo(-16, -15);
  ctx.lineTo(-10, 0);
  ctx.lineTo(-16, 15);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#243b75";
  ctx.beginPath();
  ctx.arc(2, 0, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawAmmoCan(enemy) {
  ctx.save();
  ctx.translate(enemy.x, enemy.y);
  ctx.rotate(enemy.rotation);

  const width = enemy.radius * 1.55;
  const height = enemy.radius * 1.02;

  ctx.fillStyle = "#476b35";
  ctx.strokeStyle = "#cce5a5";
  ctx.lineWidth = 2;
  ctx.fillRect(-width / 2, -height / 2, width, height);
  ctx.strokeRect(-width / 2, -height / 2, width, height);

  ctx.fillStyle = "#2f4d25";
  ctx.fillRect(-width / 2, -height / 2, width, 8);

  ctx.strokeStyle = "#20351a";
  ctx.beginPath();
  ctx.moveTo(-width * 0.28, -height / 2);
  ctx.lineTo(-width * 0.28, height / 2);
  ctx.moveTo(width * 0.28, -height / 2);
  ctx.lineTo(width * 0.28, height / 2);
  ctx.stroke();

  ctx.strokeStyle = "#bdd79a";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-width * 0.22, -height / 2);
  ctx.lineTo(-width * 0.12, -height / 2 - 9);
  ctx.lineTo(width * 0.12, -height / 2 - 9);
  ctx.lineTo(width * 0.22, -height / 2);
  ctx.stroke();

  ctx.fillStyle = "#c7dfa4";
  ctx.textAlign = "center";
  ctx.font = `bold ${Math.max(12, enemy.radius * 0.42)}px Arial`;
  ctx.fillText("GC", 0, 6);

  ctx.restore();
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.74)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 52px Arial";
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);

  ctx.fillStyle = "#c4d4ff";
  ctx.font = "24px Arial";
  ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);

  ctx.textAlign = "left";
}

function draw() {
  ctx.fillStyle = "#02040a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const star of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.4 + star.size / 4})`;
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }

  for (const enemy of enemies) drawAmmoCan(enemy);

  ctx.fillStyle = "#fff56b";
  for (const bullet of bullets) {
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const particle of particles) {
    ctx.globalAlpha = Math.max(0, particle.life);
    ctx.fillStyle = "#ffb23f";
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (ship) drawShip();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px Arial";
  ctx.fillText(`Score: ${score}`, 20, 34);
  ctx.fillText(`Lives: ${lives}`, 20, 64);
  ctx.fillText(`Level: ${level}`, canvas.width - 120, 34);

  if (!running && !gameOver && !rewardTriggered) {
    drawOverlay("GEOCACHE SPACE BLASTER", "Press Start to play");
  }

  if (gameOver) {
    drawOverlay("GAME OVER", `Final score: ${score}`);
  }

  if (rewardTriggered) {
    drawOverlay("REWARD UNLOCKED!", "Check the reward code above the game");
  }
}

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
  lastTime = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", event => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
  keys[event.key] = true;
});

document.addEventListener("keyup", event => {
  keys[event.key] = false;
});

restartButton.addEventListener("click", resetGame);

resetShip();
draw();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
