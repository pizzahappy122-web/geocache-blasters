<!DOCTYPE html>
<html>
<head>
  <title>GEOCACHE BLASTERS</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    canvas {
      background: #111;
      display: block;
      margin: 20px auto;
      border: 2px solid white;
    }
    #startBtn {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <h1>GEOCACHE BLASTERS</h1>
  <p>
    Arrow keys move and rotate. Spacebar shoots.<br>
    Reach 10,000 points to unlock the code.
  </p>

  <button id="startBtn">Start / Restart</button>
  <p id="message"></p>

  <canvas id="gameCanvas" width="600" height="600"></canvas>

<script>
// ------------------------------
// BACKEND FETCH
// ------------------------------
async function fetchRewardCode() {
  const response = await fetch(
    "https://backend-codes-mtpj.onrender.com/secret?token=pizzayay123"
  );
  const data = await response.json();
  return data.code;
}

// ------------------------------
// GAME SETUP
// ------------------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

let ship;
let bullets;
let enemies;
let score;
let running = false;

// ------------------------------
// GAME LOOP
// ------------------------------
function loop() {
  if (!running) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw ship (ORIGINAL)
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.fillStyle = "white";
  ctx.fillRect(-10, -20, 20, 40);
  ctx.restore();

  // Move bullets (ORIGINAL)
  bullets.forEach(b => {
    b.x += Math.cos(b.angle) * 10;
    b.y += Math.sin(b.angle) * 10;
    ctx.fillStyle = "yellow";
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  });

  // Spawn enemies (ORIGINAL)
  if (Math.random() < 0.02) {
    enemies.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: 30
    });
  }

  // Draw enemies — GREEN GEOCACHE AMMO CAN (NEW)
  enemies.forEach(e => {
    // Body
    ctx.fillStyle = "#2e8b57"; // geocache green
    ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);

    // Lid
    ctx.fillStyle = "#1f5e3c";
    ctx.fillRect(e.x - e.size/2, e.y - e.size/2 - 6, e.size, 10);

    // Handle
    ctx.strokeStyle = "#c0c0c0";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(e.x - 8, e.y - e.size/2 - 3);
    ctx.lineTo(e.x + 8, e.y - e.size/2 - 3);
    ctx.stroke();
  });

  // Bullet collisions (ORIGINAL)
  bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (Math.abs(b.x - e.x) < e.size/2 && Math.abs(b.y - e.y) < e.size/2) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
        score += 100;
      }
    });
  });

  // Score display (ORIGINAL)
  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.fillText("Score: " + score, 10, 20);

  // Win condition (ORIGINAL + BACKEND)
  if (score >= 10000) {
    running = false;
    message.textContent = "Loading reward code...";
    fetchRewardCode().then(code => {
      message.textContent = "Reward Code: " + code;
    }).catch(() => {
      message.textContent = "Error fetching reward code.";
    });
  }

  requestAnimationFrame(loop);
}

// ------------------------------
// CONTROLS (ORIGINAL)
// ------------------------------
document.addEventListener("keydown", e => {
  if (!running) return;

  if (e.key === "ArrowLeft") ship.angle -= 0.1;
  if (e.key === "ArrowRight") ship.angle += 0.1;
  if (e.key === "ArrowUp") {
    ship.x += Math.cos(ship.angle) * 5;
    ship.y += Math.sin(ship.angle) * 5;
  }
  if (e.key === " ") {
    bullets.push({
      x: ship.x,
      y: ship.y,
      angle: ship.angle
    });
  }
});

// ------------------------------
// START BUTTON (ORIGINAL)
// ------------------------------
startBtn.onclick = () => {
  score = 0;
  bullets = [];
  enemies = [];
  ship = { x: canvas.width / 2, y: canvas.height / 2, angle: 0 };
  message.textContent = "";
  running = true;
  loop();
};
</script>

</body>
</html>
